name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: No local machine paths in tracked text files
        run: |
          if git grep -nIE '(^|[^A-Za-z0-9])[A-Za-z]:[\/][A-Za-z0-9_]|/(Users|home)/[A-Za-z]|/mnt/[a-z]/' -- . ; then
            echo "::error::local drive or home-directory path found (see lines above)"; exit 1
          fi
      - name: Scripts parse
        run: |
          python3 -m py_compile scripts/*.py
          for f in scripts/*.sh; do bash -n "$f"; done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      # Unit tests, Flink MiniCluster tests (in-JVM, no Docker), Spring MVC slice tests,
      # and the README-numbers test. Nothing here needs Docker or the NASA data.
      - name: Build and test
        run: mvn -B -ntp verify
      - name: Mutation testing of the alert rules (PIT)
        run: mvn -B -ntp -pl bsa-core org.pitest:pitest-maven:mutationCoverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            **/target/surefire-reports/
            bsa-core/target/pit-reports/
          retention-days: 7
